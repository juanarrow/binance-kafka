<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinta de mercado</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23d6ff4a' width='16' height='16'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">Laboratorio de streaming</p>
        <h1>Cinta de mercado</h1>
      </div>
      <p id="status" class="status" data-state="wait" role="status" aria-live="polite">
        Conectando
      </p>
    </header>

    <p class="disclaimer">
      Demostración con cotizaciones públicas al contado. No es una recomendación
      de inversión.
    </p>

    <section class="meter" aria-label="Ritmo de llegada">
      <strong id="rate">—</strong>
      <span>lecturas/s</span>
    </section>

    <main id="board"></main>
    <script src="/app.js"></script>
  </body>
</html>
